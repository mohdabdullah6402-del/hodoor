<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حضور تعليم الكبار</title>
<meta name="apple-mobile-web-app-title" content="حضور تعليم الكبار">
<meta name="theme-color" content="#0F5D45">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
  html, body { margin: 0; height: 100%; background: #F3F6F4; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  .msg { font: 17px/1.8 -apple-system, system-ui, "Segoe UI", Tahoma, sans-serif; color: #14261F; padding: 48px 24px; text-align: center; }
</style>
</head>
<body>
<iframe id="app" title="حضور تعليم الكبار" allow="geolocation"></iframe>
<script>
/* الصفحة الأمامية لتطبيق حضور تعليم الكبار: تحمل شعار السلطنة أيقونةً للآيفون، وتعرض التطبيق داخلها.
   الرابط: ?a=<معرّف نشر التطبيق>&p=remote — ويُضاف إليه مفتاح التفعيل تلقائيًا بعد التفعيل. لا يلزم تعديل هذا الملف. */
(function () {
  var q = new URLSearchParams(location.search);
  var a = (q.get('a') || '').replace(/[^A-Za-z0-9_-]/g, '');
  function store(name, v) {
    try {
      if (v === undefined) return localStorage.getItem(name);
      if (v) localStorage.setItem(name, v); else localStorage.removeItem(name);
    } catch (e) { return null; }
  }
  if (!a) { document.body.innerHTML = '<div class="msg">الرابط غير مكتمل. افتح الرابط الذي أرسله المشرف كما هو.</div>'; return; }
  var K = 'att_key_' + a;
  var key = (q.get('k') || '').replace(/[^A-Za-z0-9]/g, '') || store(K) || '';
  function keep(k) {
    var u = new URL(location.href);
    if (k) u.searchParams.set('k', k); else u.searchParams.delete('k');
    history.replaceState(null, '', u.toString());
  }
  document.getElementById('app').src = 'https://script.google.com/macros/s/' + a + '/exec?p=remote' + (key ? '&k=' + key : '');
  if (key) { store(K, key); keep(key); }
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/([a-z0-9-]+\.)*(google\.com|googleusercontent\.com)$/.test(e.origin)) return;
    var d = e.data;
    if (!d || typeof d.attKey !== 'string') return;
    var k = d.attKey.replace(/[^A-Za-z0-9]/g, '');
    store(K, k);
    keep(k);
  });
})();
</script>
</body>
</html>
